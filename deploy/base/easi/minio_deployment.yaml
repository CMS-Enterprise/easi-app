apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: easi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        # quay.io stopped allowing anonymous pulls of minio/minio (Sep 2026), the same way Docker
        # Hub did before it (Oct 2025) - MinIO's own GitHub repo is now archived entirely, so
        # there's no official image left to pull from at all. pgsty/silo is an actively-maintained,
        # S3-API- and CLI-compatible fork, still freely published to Docker Hub. Uses the image's
        # own docker-entrypoint.sh (no `command:` override, which is Kubernetes' equivalent of
        # Docker's `entrypoint:`) - only `args:` (Kubernetes' equivalent of Docker's `command:`) is
        # set, matching pgsty's documented usage and what's actually been verified to work.
        - args: ['server', '/data', '--console-address', ':9001', '--address', ':9004']
          image: docker.io/pgsty/silo:latest
          imagePullPolicy: Always
          name: minio
          ports:
            - containerPort: 9004
              # hostPort: 9004
              protocol: TCP
            - containerPort: 9001
              # hostPort: 9001
              protocol: TCP
          resources: {}
      restartPolicy: Always
