services:
  db:
    image: postgres:17.5
    environment:
      - POSTGRES_PASSWORD=mysecretpassword
    ports:
      - '5432:5432'
  db_migrate:
    image: '${ECR_REGISTRY}/${ECR_REPOSITORY}:${GIT_HASH}'
    environment:
      - FLYWAY_USER=postgres
      - FLYWAY_PASSWORD=mysecretpassword
      - FLYWAY_URL=jdbc:postgresql://db/postgres
      - FLYWAY_PLACEHOLDERS_APP_USER_PASSWORD=supersecretapp # Keep this around for legacy migration V88__Add_app_user.sql
    depends_on:
      - db
  minio:
    restart: always
    # quay.io stopped allowing anonymous pulls of minio/minio (Sep 2026), the same way Docker Hub
    # did before it (Oct 2025) - MinIO's own GitHub repo is now archived entirely, so there's no
    # official image left to pull from at all. pgsty/silo is an actively-maintained, S3-API- and
    # CLI-compatible fork, still freely published to Docker Hub. Uses the image's own
    # docker-entrypoint.sh (not a custom entrypoint override) - `command:` alone matches pgsty's
    # documented usage and is what's actually been verified to work.
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    ports:
      - '9004:9004'
    command: server --address :9004 /data
  minio_mc:
    # pgsty/mc is the companion client image (ships the `mc` binary, "mcli" upstream) for
    # pgsty/silo - see the minio service above for why we're not on quay.io/minio/mc anymore.
    image: docker.io/pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      - minio
    volumes:
      - ./minio_config.json:/root/.mc/config.json
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc rb --force local/easi-app-file-uploads/;
      /usr/bin/mc mb --quiet local/easi-app-file-uploads/;
      /usr/bin/mc anonymous set public local/easi-app-file-uploads;
      "
